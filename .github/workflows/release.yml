name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and inspect without publishing'
        type: boolean
        default: true

permissions:
  contents: read
  # Required for npm Trusted Publishing: npm exchanges this for a short-lived
  # credential, so no token is stored in the repository.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted Publishing needs a recent npm; the one bundled with Node 22 is
      # older than the OIDC support.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx vitest run

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json $pkg" >&2
            exit 1
          fi

      - name: Inspect the tarball
        run: npm pack --dry-run

      # Trusted Publishing cannot cover a first release: a trusted publisher is
      # configured on a package's settings page, and there is no page until the
      # package exists. So the first tag goes out under an automation token and
      # this `env:` block comes back out once the publisher is configured.
      # Provenance does not depend on any of that — only on `id-token: write`
      # above — so 0.1.0 is attested either way.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
